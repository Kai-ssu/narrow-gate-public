<h1>His Kingdom Endures</h1>
<p class="scene" data-bible="niv">His dominion is an eternal dominion; his kingdom endures from generation to generation.</p>
<p class="scene" data-bible="nkjv">For His dominion is an everlasting dominion, and His kingdom is from generation to generation.</p>
